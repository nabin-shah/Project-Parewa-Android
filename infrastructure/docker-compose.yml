# ==============================================================================
# Project Parewa — Local Docker Compose Stack
# Server: 192.168.178.200 (Ubuntu Server)
# ==============================================================================

networks:
  parewa-net:
    driver: bridge

volumes:
  redis-data:
    driver: local

services:

  # ============================================================================
  # Redis — Persistent Message Queue (AOF mode)
  # Port 6379 is intentionally NOT exposed to host. Only accessible internally
  # via parewa-net to the backend API service.
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: parewa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - parewa-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # coturn — TURN/STUN Server for WebRTC NAT Traversal
  # Ports:
  #   3478  TCP/UDP — STUN/TURN (plain)
  #   5349  TCP/UDP — STUN/TURN over TLS
  #   49152-49300 UDP — TURN relay media port range
  # ============================================================================
  coturn:
    image: coturn/coturn:latest
    container_name: parewa-coturn
    restart: always
    network_mode: "host"
    command:
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --realm=parewa.local
      - --user=parewa:parewapassword
      - --min-port=49152
      - --max-port=65535

  # ============================================================================
  # Nginx — TLS Termination & Reverse Proxy
  # Port 80  → HTTP (for redirect to HTTPS)
  # Port 443 → HTTPS / WSS → proxies to backend API on :8080
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: parewa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - parewa-net
    depends_on:
      parewa-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/health | grep OK || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================================================
  # parewa-backend — Email OTP Authentication Service (Task 2)
  # Node.js + Express + TypeScript. Listens on :8080 internally.
  # NOT exposed to host directly — accessed via Nginx reverse proxy.
  # Provides mock Signal registration endpoints using email-based OTP.
  # ============================================================================
  parewa-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: parewa-backend
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - ../backend/.env
    networks:
      - parewa-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3