# ==============================================================================
# Project Parewa — Nginx Reverse Proxy & TLS Termination
# Server: 192.168.178.200 (Ubuntu Server, LAN deployment)
# ==============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ---- General Settings ----------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging -------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---- Upstream: Backend API -----------------------------------------------
    upstream parewa_backend {
        server parewa-backend:8080;
    }

    # ==========================================================================
    # HTTP → HTTPS Redirect (port 80)
    # ==========================================================================
    server {
        listen 80;
        server_name 192.168.178.200 localhost;

        # Health check endpoint (used by Docker healthcheck before TLS is up)
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # HTTPS / WSS — TLS Termination & Reverse Proxy (port 443)
    # ==========================================================================
    server {
        listen 443 ssl;
        server_name 192.168.178.200 localhost;

        # ---- SSL Certificates ------------------------------------------------
        ssl_certificate     /etc/nginx/certs/parewa.crt;
        ssl_certificate_key /etc/nginx/certs/parewa.key;

        # ---- SSL Hardening ---------------------------------------------------
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---- Proxy Headers ---------------------------------------------------
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- API / General Traffic -------------------------------------------
        location / {
            proxy_pass http://parewa_backend;
        }

        # ---- WebSocket Upgrade (for Signal's persistent connection) ----------
        location /v1/websocket {
            proxy_pass http://parewa_backend;

            # WebSocket upgrade headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Long-lived connection timeouts for WebSocket
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 60s;
        }

        # ---- Health Check (internal) -----------------------------------------
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
