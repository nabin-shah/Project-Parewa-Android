# ==============================================================================
# Project Parewa — coturn TURN/STUN Server Configuration
# Server: 192.168.178.200 (Ubuntu Server, LAN deployment)
# ==============================================================================

# ---- Network & Realm --------------------------------------------------------

# The server's listening IP address
listening-ip=0.0.0.0

# External IP for TURN relay (the LAN IP of the Ubuntu server)
external-ip=192.168.178.200

# Realm used for TURN authentication
realm=192.168.178.200

# ---- Ports -------------------------------------------------------------------

# Standard STUN/TURN port
listening-port=3478

# TLS STUN/TURN port
tls-listening-port=5349

# Minimum and maximum ports for UDP relay (media)
min-port=49152
max-port=49300

# ---- Authentication ---------------------------------------------------------

# Use HMAC-based ephemeral credentials (shared secret)
use-auth-secret

# Static auth secret — MUST match backend server's TURN credential generator
static-auth-secret=parewa_secret_key_2026

# ---- TLS / DTLS (optional: will use certs if present) -----------------------

# Path to TLS certificate and private key (same certs Nginx uses)
# Uncomment and adjust paths if TLS TURN is needed:
# cert=/etc/coturn/certs/parewa.crt
# pkey=/etc/coturn/certs/parewa.key

# ---- Logging -----------------------------------------------------------------

# Disable logging to stdout (container logs via Docker instead)
no-stdout-log

# Log to a file inside the container (optional)
# log-file=/var/log/coturn/turnserver.log

# ---- Security & Misc --------------------------------------------------------

# Fingerprinting — required by most WebRTC clients
fingerprint

# Do not allow peers to connect to coturn's own ports (anti-relay-loop)
no-loopback-peers

# Do not allow peers in the same multicast range
no-multicast-peers

# Limit total allocation lifetime to 600 seconds (10 min default)
max-allocate-lifetime=600

# Limit per-user allocation count
total-quota=100
user-quota=10
